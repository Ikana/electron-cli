name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v0.3.0-alpha.1"
        required: true

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          prerelease_flag=""
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease_flag="--prerelease"
          fi

          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              $prerelease_flag \
              --notes "Experimental alpha release for electron-cli."

  build:
    name: Build ${{ matrix.asset }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: linux-x64
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: darwin-arm64
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: darwin-x64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: win32-x64
            ext: ".exe"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add "${{ matrix.target }}"

      - name: Build release binary
        run: cargo build --release --target "${{ matrix.target }}"

      - name: Prepare asset
        shell: bash
        run: |
          asset_name="electron-cli-${{ steps.tag.outputs.tag }}-${{ matrix.asset }}${{ matrix.ext }}"
          source="target/${{ matrix.target }}/release/electron-cli${{ matrix.ext }}"
          cp "$source" "$asset_name"
          echo "ASSET_NAME=$asset_name" >> "$GITHUB_ENV"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.tag.outputs.tag }}" "$env:ASSET_NAME" --repo "$env:GITHUB_REPOSITORY" --clobber
        if: runner.os == 'Windows'

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.tag.outputs.tag }}" "$ASSET_NAME" --repo "$GITHUB_REPOSITORY" --clobber
        if: runner.os != 'Windows'
