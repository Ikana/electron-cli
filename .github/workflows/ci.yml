name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt

      - name: Check formatting and lints
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build release binary
        run: npm run build

      - name: Smoke test npm shim
        run: |
          node bin/electron-cli.js --version
          node bin/electron-cli.js doctor --json
          node bin/electron-cli.js inspect --json
          node bin/electron-cli.js plan --json

      - name: Check npm package contents
        run: npm pack --dry-run --ignore-scripts
