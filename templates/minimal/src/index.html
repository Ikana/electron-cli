<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>electron-cli</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f5f5f2;
        color: #1d2328;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(720px, calc(100vw - 48px));
      }

      h1 {
        margin: 0 0 12px;
        font-size: 5rem;
        line-height: 0.92;
        letter-spacing: 0;
      }

      p {
        max-width: 48rem;
        margin: 0 0 24px;
        font-size: 1.05rem;
        line-height: 1.6;
      }

      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 8px 16px;
        margin: 0;
        padding-top: 20px;
        border-top: 1px solid color-mix(in srgb, currentColor 24%, transparent);
      }

      dt {
        font-weight: 700;
      }

      dd {
        margin: 0;
      }

      @media (max-width: 640px) {
        h1 {
          font-size: 3rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>electron-cli</h1>
      <p>
        This app was generated by the experimental Rust-native electron-cli
        template.
      </p>
      <dl>
        <dt>Runtime</dt>
        <dd id="runtime">Loading...</dd>
        <dt>Platform</dt>
        <dd id="platform">Loading...</dd>
      </dl>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
